<script>
(function () {
  'use strict';

  var S = {
    items: [], byId: {}, noteCounts: {}, lists: {}, statuses: [], statusMap: {},
    sort: { key: 'id', dir: -1 }, openId: null, pending: 0, loadedAt: 0, email: '',
    selected: {}, visible: [], reviews: [], nudgeStatuses: [], nudgeAfter: 2
  };
  var $ = function (id) { return document.getElementById(id); };
  var GROUPS = ['Not Started', 'In Progress', 'Completed', 'Discarded'];

  // ------------------------------------------------------------ server calls
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
        reject(e && e.message ? e : new Error(String(e)));
      });
      runner[fn].apply(runner, args);
    });
  }
  function busy(delta) {
    S.pending += delta;
    var el = $('sync');
    el.className = 'sync' + (S.pending > 0 ? ' busy' : '');
    $('sync-text').textContent = S.pending > 0 ? 'Saving…' : 'Saved';
  }
  function failSync(msg) {
    $('sync').className = 'sync err';
    $('sync-text').textContent = 'Not saved';
    toast(msg, true);
  }

  // ------------------------------------------------------------ helpers
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function me() { try { return localStorage.getItem('ccqa.me') || ''; } catch (e) { return ''; } }
  function setMe(v) { try { localStorage.setItem('ccqa.me', v); } catch (e) {} showMe(); }
  /** Flags the top-bar name picker while no name is set. */
  function showMe() {
    var wrap = document.querySelector('.me');
    if (wrap) wrap.classList.toggle('missing', !me());
  }

  // Every change needs a name. Without one, ask for it, then carry on with what the person was doing.
  var afterMe = null;
  function withMe(fn) {
    if (me()) { fn(); return true; }
    afterMe = fn;
    $('me-dlg-select').innerHTML = options(S.lists.handlers || [], '', 'Pick your name');
    $('me-err').hidden = true;
    var wrap = document.querySelector('.me');
    wrap.classList.remove('nudge'); void wrap.offsetWidth; wrap.classList.add('nudge');
    $('me-dlg').showModal();
    $('me-dlg-select').focus();
    return false;
  }
  function group(status) {
    if (!status) return 'Not Started';
    return (S.statusMap[status] && S.statusMap[status].group) || 'In Progress';
  }
  function fmtWhen(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }
  function fmtDay(s) {
    if (!s) return '';
    var p = s.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }
  var toastTimer;
  function toast(msg, isErr) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast' + (isErr ? ' err' : '');
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, isErr ? 6000 : 3000);
  }
  function options(list, selected, blankLabel) {
    var html = blankLabel != null ? '<option value="">' + esc(blankLabel) + '</option>' : '';
    var seen = false;
    list.forEach(function (v) {
      if (v === selected) seen = true;
      html += '<option' + (v === selected ? ' selected' : '') + '>' + esc(v) + '</option>';
    });
    if (selected && !seen) html += '<option selected>' + esc(selected) + '</option>';
    return html;
  }
  function statusStyle(status) {
    var s = S.statusMap[status];
    return s ? 'background:' + s.fill + ';color:' + s.ink : '';
  }

  // ------------------------------------------------------------ load
  function load(initial) {
    return call('getBootstrap').then(function (data) {
      S.items = data.items;
      S.byId = {};
      S.items.forEach(function (i) { S.byId[i.id] = i; });
      S.noteCounts = data.noteCounts || {};
      S.lists = data.lists;
      S.statuses = data.statuses;
      S.statusMap = {};
      S.statuses.forEach(function (s) { S.statusMap[s.name] = s; });
      S.email = data.email;
      S.slack = data.slackEnabled;
      S.slackDm = data.slackDm;
      S.currentQuarter = data.currentQuarter;
      S.slackTokenIssue = data.slackTokenIssue || '';
      S.reviews = data.reviews || [];
      S.today = data.today;
      S.nudgeStatuses = data.nudgeStatuses || [];
      S.nudgeAfter = data.nudgeAfterDays || 2;
      S.deleteEnabled = data.deleteEnabled;
      S.appUrl = data.appUrl || '';
      S.emailTo = data.emailTo || [];
      S.emailCc = data.emailCc || [];
      S.loadedAt = Date.now();
      if (initial) { setupControls(data); showMe(); }
      renderLede(data);
      renderQuarters();
      render();
      if (S.openId && S.byId[S.openId]) fillDrawerFields(S.byId[S.openId]);
      if (S.pending === 0) { $('sync').className = 'sync'; $('sync-text').textContent = 'Up to date'; }
    });
  }

  function renderLede(data) {
    var parts = ['<b>' + S.items.length + '</b> AXO items'];
    if (data.lastImport) {
      var li = data.lastImport.split('|');
      parts.push('last import ' + esc(fmtWhen(li[0])) + (li[1] ? ' by ' + esc(li[1].replace(/\s*<.*>$/, '')) : ''));
    } else {
      parts.push('no import yet: start with <b>Import AXO CSV</b>');
    }
    parts.push('Slack ' + (data.slackEnabled ? 'notifications on' : 'not connected'));
    if (data.slackTokenIssue) parts.push('<span class="warn">Slack DMs are off: ' + esc(data.slackTokenIssue) + '</span>');
    $('lede').innerHTML = parts.join(' · ');
    if (data.sheetUrl) $('sheet-link').innerHTML = '<a href="' + esc(data.sheetUrl) + '" target="_blank" rel="noopener" style="color:var(--brand)">Open the Google Sheet</a>';
  }

  function setupControls() {
    $('me-select').innerHTML = options(S.lists.handlers, me(), 'Pick your name');
    $('f-cat').innerHTML = options(S.lists.categories, '', 'All');
    var st = '<option value="">All</option><option value="__open">Open</option>';
    GROUPS.forEach(function (g) { st += '<option value="g:' + g + '">' + g + '</option>'; });
    st += '<optgroup label="Status">';
    S.statuses.forEach(function (s) { st += '<option value="s:' + esc(s.name) + '">' + esc(s.name) + '</option>'; });
    $('f-status').innerHTML = st + '</optgroup>';
    var hd = '<option value="">Anyone</option><option value="__me">Me</option><option value="__none">Unassigned</option>';
    S.lists.handlers.forEach(function (h) { hd += '<option>' + esc(h) + '</option>'; });
    $('f-handler').innerHTML = hd;
    $('note-kind').innerHTML = options(S.lists.noteKinds.filter(function (k) { return k !== 'Review Points'; }), 'General');
    restoreQuarter();
    restoreFilters();
  }

  // ------------------------------------------------------------ quarters
  function restoreQuarter() {
    var q;
    try { q = JSON.parse(localStorage.getItem('ccqa.quarter') || 'null'); } catch (e) {}
    var cur = S.currentQuarter.split(' ');
    S.quarter = q && q.q ? q.q : cur[0];
    S.year = q && q.y ? q.y : cur[1];
  }
  function saveQuarter() { try { localStorage.setItem('ccqa.quarter', JSON.stringify({ q: S.quarter, y: S.year })); } catch (e) {} }
  function selectedQuarter() { return S.quarter === 'all' ? '' : S.quarter + ' ' + S.year; }
  function scoped() {
    var q = selectedQuarter();
    return q ? S.items.filter(function (i) { return i.quarter === q; }) : S.items;
  }
  function years() {
    var cur = +S.currentQuarter.split(' ')[1], set = {};
    set[cur] = set[cur - 1] = set[cur + 1] = true;
    S.items.forEach(function (i) { if (i.quarter) set[i.quarter.split(' ')[1]] = true; });
    if (S.year) set[S.year] = true;
    return Object.keys(set).sort();
  }
  function quarterOptions(selected) {
    var html = '';
    years().forEach(function (y) {
      for (var q = 1; q <= 4; q++) {
        var v = 'Q' + q + ' ' + y;
        html += '<option' + (v === selected ? ' selected' : '') + '>' + v + '</option>';
      }
    });
    return html;
  }
  function renderQuarters() {
    var counts = {};
    S.items.forEach(function (i) { if (i.quarter) counts[i.quarter] = (counts[i.quarter] || 0) + 1; });
    var html = '';
    ['Q1', 'Q2', 'Q3', 'Q4'].forEach(function (q) {
      var label = q + ' ' + S.year;
      html += '<button type="button" role="tab" data-q="' + q + '" aria-selected="' + (S.quarter === q) + '"' +
        (label === S.currentQuarter ? ' class="now" title="Current quarter"' : '') + '>' + q + '<span class="n">' + (counts[label] || 0) + '</span></button>';
    });
    html += '<button type="button" role="tab" data-q="all" aria-selected="' + (S.quarter === 'all') + '">All<span class="n">' + S.items.length + '</span></button>';
    $('q-tabs').innerHTML = html;
    $('q-year').innerHTML = years().map(function (y) { return '<option' + (y === S.year ? ' selected' : '') + '>' + y + '</option>'; }).join('');
    $('q-year').disabled = S.quarter === 'all';
  }

  // ------------------------------------------------------------ filters
  var FILTER_IDS = ['f-q', 'f-cat', 'f-type', 'f-status', 'f-handler', 'f-prio', 'f-hp', 'f-stuck', 'f-gone'];
  function readFilters() {
    return {
      q: $('f-q').value.trim().toLowerCase(), cat: $('f-cat').value, type: $('f-type').value,
      status: $('f-status').value, handler: $('f-handler').value, prio: $('f-prio').value,
      hp: $('f-hp').checked, gone: $('f-gone').checked, stuck: $('f-stuck').checked
    };
  }
  /** In a status that gets nudged, for the nudge threshold or longer. */
  function isStuck(i) {
    return i.daysInStatus != null && i.daysInStatus >= S.nudgeAfter && S.nudgeStatuses.indexOf(i.status) >= 0;
  }
  function saveFilters() {
    try { localStorage.setItem('ccqa.filters', JSON.stringify(readFilters())); } catch (e) {}
  }
  function restoreFilters() {
    var f;
    try { f = JSON.parse(localStorage.getItem('ccqa.filters') || 'null'); } catch (e) {}
    if (!f) return;
    $('f-q').value = f.q || ''; $('f-cat').value = f.cat || ''; $('f-type').value = f.type || '';
    $('f-status').value = f.status || ''; $('f-handler').value = f.handler || ''; $('f-prio').value = f.prio || '';
    $('f-hp').checked = !!f.hp; $('f-gone').checked = !!f.gone; $('f-stuck').checked = !!f.stuck;
  }
  function matches(i, f) {
    if (f.q) {
      var hay = (i.id + ' ' + i.name + ' ' + i.developer + ' ' + i.reportedBy + ' ' + i.commentDev + ' ' + i.commentSed + ' ' + i.workflowStep).toLowerCase();
      if (hay.indexOf(f.q) < 0) return false;
    }
    if (f.cat && i.axoCategory !== f.cat) return false;
    if (f.type && i.itemType !== f.type) return false;
    if (f.prio === '(none)' ? !!i.priority : (f.prio && i.priority !== f.prio)) return false;
    if (f.hp && !i.highPriority) return false;
    if (f.gone && i.inLatestImport) return false;
    if (f.stuck && !isStuck(i)) return false;
    if (f.status) {
      var g = group(i.status);
      if (f.status === '__open' && g !== 'Not Started' && g !== 'In Progress') return false;
      if (f.status.indexOf('g:') === 0 && g !== f.status.slice(2)) return false;
      if (f.status.indexOf('s:') === 0 && i.status !== f.status.slice(2)) return false;
    }
    if (f.handler === '__me') { if (!me() || i.handler !== me()) return false; }
    else if (f.handler === '__none') { if (i.handler) return false; }
    else if (f.handler && i.handler !== f.handler) return false;
    return true;
  }

  // ------------------------------------------------------------ render
  function render() {
    renderKpis();
    renderBreakdown();
    renderWorkload();
    renderTable();
  }

  function renderKpis() {
    var scope = scoped();
    var c = { total: scope.length, 'Not Started': 0, 'In Progress': 0, Completed: 0, Discarded: 0, hp: 0, unassigned: 0, stuck: 0 };
    scope.forEach(function (i) {
      var g = group(i.status);
      c[g]++;
      var open = g === 'Not Started' || g === 'In Progress';
      if (open && i.highPriority) c.hp++;
      if (open && !i.handler) c.unassigned++;
      if (isStuck(i)) c.stuck++;
    });
    var f = readFilters();
    var tiles = [
      { label: 'Total', val: c.total, sub: selectedQuarter() || 'all quarters', tone: 'brand', key: 'all', on: !f.status && !f.hp && !f.handler && !f.stuck },
      { label: 'Not started', val: c['Not Started'], sub: 'no status yet', tone: 'neu', key: 'g:Not Started', on: f.status === 'g:Not Started' },
      { label: 'In progress', val: c['In Progress'], sub: 'QA, BA/DEV, review', tone: 'sky', key: 'g:In Progress', on: f.status === 'g:In Progress' },
      { label: 'Completed', val: c.Completed, sub: 'Done + For Upload', tone: 'ok', key: 'g:Completed', on: f.status === 'g:Completed' },
      { label: 'Discarded', val: c.Discarded, sub: 'Moved + Withdraw', tone: 'neu', key: 'g:Discarded', on: f.status === 'g:Discarded' },
      { label: 'High priority open', val: c.hp, sub: 'not completed', tone: 'bad', key: 'hp', on: f.hp && f.status === '__open' },
      { label: 'Unassigned open', val: c.unassigned, sub: 'no handler', tone: 'orange', key: 'unassigned', on: f.handler === '__none' && f.status === '__open' },
      { label: S.nudgeAfter + '+ days in status', val: c.stuck, sub: 'working days, no change', tone: c.stuck ? 'bad' : 'neu', key: 'stuck', on: f.stuck }
    ];
    $('kpis').innerHTML = tiles.map(function (t) {
      return '<button type="button" class="kpi t-' + t.tone + '" data-kpi="' + t.key + '" aria-pressed="' + !!t.on + '">' +
        '<div class="k-label">' + t.label + '</div><div class="k-val">' + t.val + '</div><div class="k-sub">' + t.sub + '</div></button>';
    }).join('');
  }

  function renderBreakdown() {
    var counts = {}, none = 0, scope = scoped();
    scope.forEach(function (i) { if (i.status) counts[i.status] = (counts[i.status] || 0) + 1; else none++; });
    var total = scope.length || 1;
    var segs = [{ name: '', label: 'Not started', fill: 'var(--line-strong)', ink: 'var(--fg)', n: none }]
      .concat(S.statuses.map(function (s) { return { name: s.name, label: s.name, fill: s.fill, ink: s.ink, n: counts[s.name] || 0 }; }));
    $('stack').innerHTML = segs.filter(function (s) { return s.n; }).map(function (s) {
      var pct = s.n / total * 100;
      return '<button type="button" data-status="' + esc(s.name) + '" style="flex:' + s.n + ';background:' + s.fill + ';color:' + s.ink + '" title="' +
        esc(s.label) + ': ' + s.n + ' (' + Math.round(pct) + '%)">' + (pct >= 5 ? s.n : '') + '</button>';
    }).join('');
    $('legend').innerHTML = segs.map(function (s) {
      return '<button type="button" data-status="' + esc(s.name) + '"><i style="background:' + s.fill + '"></i>' + esc(s.label) + ' <b>' + s.n + '</b></button>';
    }).join('');
  }

  // ------------------------------------------------------------ QA workload
  function renderWorkload() {
    var scope = scoped(), rows = {}, inScope = {};
    var row = function (k) {
      return rows[k] = rows[k] || { name: k, total: 0, 'Not Started': 0, 'In Progress': 0, Completed: 0, Discarded: 0, reviews: 0 };
    };
    scope.forEach(function (i) { inScope[i.id] = true; var r = row(i.handler || ''); r.total++; r[group(i.status)]++; });
    S.reviews.forEach(function (rv) { if (inScope[rv.id] && rv.by) row(rv.by).reviews++; });
    var list = Object.keys(rows).map(function (k) { return rows[k]; }).sort(function (a, b) {
      if (!a.name) return 1;
      if (!b.name) return -1;
      return b.total - a.total || (a.name < b.name ? -1 : 1);
    });
    if (!list.length) { $('workload').innerHTML = '<div class="wl-empty">No AXOs in this view yet.</div>'; return; }
    var max = Math.max.apply(null, list.map(function (r) { return r.total; })) || 1;
    var picked = $('f-handler').value;
    $('workload').innerHTML = list.map(function (r) {
      var seg = function (cls, n) { return n ? '<i class="' + cls + '" style="flex:' + n + '"></i>' : ''; };
      var open = r['Not Started'] + r['In Progress'];
      var key = r.name || '__none';
      return '<button type="button" class="wl-row' + (r.name ? '' : ' unassigned') + '" data-handler="' + esc(key) + '" aria-pressed="' + (picked === key) + '" title="' +
        esc((r.name || 'Unassigned') + ': ' + r['In Progress'] + ' in progress, ' + r['Not Started'] + ' not started, ' + r.Completed + ' completed, ' + r.Discarded + ' discarded') + '">' +
        '<span class="wl-name">' + esc(r.name || 'Unassigned') + '</span>' +
        '<span class="wl-track"><span class="wl-bar" style="width:' + (r.total / max * 100) + '%">' +
          seg('g-ip', r['In Progress']) + seg('g-ns', r['Not Started']) + seg('g-co', r.Completed) + seg('g-di', r.Discarded) + '</span></span>' +
        '<span class="wl-num"><b>' + r.total + '</b>' + open + ' open · ' + r.Completed + ' done' +
          (r.reviews ? ' · <span class="rv">' + r.reviews + ' review' + (r.reviews > 1 ? 's' : '') + ' given</span>' : '') + '</span></button>';
    }).join('');
  }

  function daysCell(i) {
    if (i.daysInStatus == null) return '<span class="days" title="Finished">—</span>';
    var n = i.daysInStatus;
    var cls = isStuck(i) ? (n >= 5 ? ' late' : ' warn') : '';
    return '<span class="days' + cls + '" title="' + esc((i.status || 'Not started') + ' since ' + fmtWhen(i.statusSince) + '. Working days, Tuesday to Saturday.') + '">' +
      n + (n === 1 ? ' day' : ' days') + '</span>';
  }

  function sortVal(i, k) {
    if (k === 'id') return +i.id || 0;
    if (k === 'daysInStatus') return i.daysInStatus == null ? -1 : i.daysInStatus;
    if (k === 'notes') return S.noteCounts[i.id] || 0;
    if (k === 'highPriority') return i.highPriority ? 1 : 0;
    if (k === 'priority') return { High: 3, Medium: 2, Low: 1 }[i.priority] || 0;
    if (k === 'status') return i.status ? S.statuses.findIndex(function (s) { return s.name === i.status; }) + 1 : 0;
    return String(i[k] || '').toLowerCase();
  }

  function rowHtml(i) {
    var n = S.noteCounts[i.id] || 0;
    var sub = wfChip(i.workflowStep);
    if (!i.inLatestImport && i.lastImported) sub += '<span class="gone">not in latest export</span>';
    var stOpts = '<option value="">Not started</option>' + S.statuses.map(function (s) {
      return '<option' + (s.name === i.status ? ' selected' : '') + '>' + esc(s.name) + '</option>';
    }).join('');
    var sel = !!S.selected[i.id];
    return '<tr data-id="' + esc(i.id) + '" class="' + (i.highPriority ? 'is-hp' : '') + (sel ? ' is-sel' : '') + '">' +
      '<td class="c-sel"><input type="checkbox" class="sel-box" aria-label="Select AXO ' + esc(i.id) + '"' + (sel ? ' checked' : '') + '></td>' +
      '<td><button type="button" class="id-link" data-open="' + esc(i.id) + '">' + esc(i.id) + '</button>' +
        (S.quarter === 'all' && i.quarter ? '<span class="q-tag">' + esc(i.quarter) + '</span>' : '') + '</td>' +
      '<td><span class="type ' + (i.itemType === 'Bug' ? 'bug' : 'story') + '">' + esc(i.itemType) + '</span></td>' +
      '<td class="c-name"><span class="nm" data-open="' + esc(i.id) + '">' + esc(i.name) + '</span><span class="sub">' + sub + '</span>' + peopleHtml(i) + '</td>' +
      '<td><select class="cell-sel" data-field="axoCategory" aria-label="AXO Category">' + options(S.lists.categories, i.axoCategory, '—') + '</select></td>' +
      '<td><span class="prio ' + esc(i.priority) + '">' + esc(i.priority || 'None') + '</span></td>' +
      '<td><input type="checkbox" class="hp-box" data-field="highPriority" aria-label="High priority"' + (i.highPriority ? ' checked' : '') + '></td>' +
      '<td><select class="cell-sel" data-field="system" aria-label="System">' + options(S.lists.systems, i.system, '—') + '</select></td>' +
      '<td><select class="cell-sel" data-field="handler" aria-label="Handler">' + options(S.lists.handlers, i.handler, 'Unassigned') + '</select></td>' +
      '<td><select class="cell-sel status-sel' + (i.status ? '' : ' none') + '" data-field="status" aria-label="Status" style="' + statusStyle(i.status) + '">' + stOpts + '</select></td>' +
      '<td>' + daysCell(i) + '</td>' +
      '<td><input type="date" class="cell-date" data-field="completedOn" aria-label="Date of completion" value="' + esc(i.completedOn) + '"></td>' +
      '<td><button type="button" class="notes-btn' + (n ? ' has' : '') + '" data-open="' + esc(i.id) + '" data-focus="notes">' + (n ? n + ' note' + (n > 1 ? 's' : '') : 'Add note') + '</button></td>' +
      '</tr>';
  }

  // Colour by AXO workflow stage: "1. New", "4B. Development In Progress", "Rejected", ...
  function wfClass(step) {
    var s = String(step || '').toLowerCase();
    if (!s) return '';
    if (s.indexOf('reject') >= 0) return 'wf-rejected';
    if (s.indexOf('rework') >= 0 || /^4\.?\s*a\b/.test(s)) return 'wf-rework';
    var n = parseInt(s, 10);
    return { 1: 'wf-new', 2: 'wf-approved', 3: 'wf-approved', 4: 'wf-dev', 5: 'wf-review', 6: 'wf-cases',
      7: 'wf-ready', 8: 'wf-file' }[n] || (n >= 9 ? 'wf-release' : '');
  }
  function wfChip(step) {
    return step ? '<span class="wf ' + wfClass(step) + '">' + esc(step) + '</span>' : '';
  }

  function peopleHtml(i) {
    var who = function (label, name) {
      return '<span><em class="' + label.toLowerCase() + '">' + label + '</em>' + (name ? esc(name) : '<span class="none">Not set</span>') + '</span>';
    };
    return '<div class="people">' + who('Dev', i.developer) + who('BA', i.reportedBy) + '</div>';
  }

  function renderTable() {
    var f = readFilters();
    var scope = scoped();
    var rows = scope.filter(function (i) { return matches(i, f); });
    var k = S.sort.key, d = S.sort.dir;
    rows.sort(function (a, b) {
      var x = sortVal(a, k), y = sortVal(b, k);
      if (x < y) return -1 * d;
      if (x > y) return 1 * d;
      return (+b.id) - (+a.id);
    });
    document.querySelectorAll('thead th[data-sort]').forEach(function (th) {
      if (th.dataset.sort === k) { th.setAttribute('aria-sort', d > 0 ? 'ascending' : 'descending'); th.querySelector('.arr').textContent = d > 0 ? '▴' : '▾'; }
      else { th.removeAttribute('aria-sort'); th.querySelector('.arr').textContent = '▾'; }
    });
    // Selection only ever covers rows on screen, so "Delete selected" can't hit hidden AXOs.
    S.visible = rows.map(function (i) { return i.id; });
    var keep = {};
    S.visible.forEach(function (id) { if (S.selected[id]) keep[id] = true; });
    S.selected = keep;
    updateSelBar();
    $('tbody').innerHTML = rows.length ? rows.map(rowHtml).join('') :
      '<tr><td colspan="13" class="empty">' + (scope.length ? 'No items match these filters.' :
        S.items.length ? 'No AXOs tagged ' + esc(selectedQuarter()) + ' yet.' : 'No items yet. Import the AXO CSV export to get started.') + '</td></tr>';
    var where = selectedQuarter() ? ' in ' + selectedQuarter() : '';
    $('count').textContent = (rows.length === scope.length ? scope.length : rows.length + ' of ' + scope.length) + ' items' + where;
  }

  function updateSelBar() {
    var n = Object.keys(S.selected).length, total = S.visible.length;
    $('selbar').hidden = !n;
    $('sel-count').textContent = n + ' selected';
    $('sel-all').hidden = n >= total;
    $('sel-all').textContent = 'Select all ' + total + ' in this view';
    $('sel-delete').textContent = 'Delete ' + (n === S.items.length && n > 1 ? 'ALL ' + n : n === 1 ? '1 AXO' : n + ' AXOs');
    var head = $('sel-head');
    head.checked = total > 0 && n >= total;
    head.indeterminate = n > 0 && n < total;
  }
  function selectAllVisible(on) {
    S.selected = {};
    if (on) S.visible.forEach(function (id) { S.selected[id] = true; });
    document.querySelectorAll('#tbody tr[data-id]').forEach(function (tr) {
      tr.classList.toggle('is-sel', on);
      tr.querySelector('.sel-box').checked = on;
    });
    updateSelBar();
  }

  function replaceRow(id, flash) {
    var tr = document.querySelector('tr[data-id="' + CSS.escape(id) + '"]');
    if (!tr || !S.byId[id]) return;
    var tmp = document.createElement('tbody');
    tmp.innerHTML = rowHtml(S.byId[id]);
    var nr = tmp.firstChild;
    if (flash) nr.classList.add('flash');
    tr.replaceWith(nr);
  }

  // ------------------------------------------------------------ edits
  function save(id, field, value) {
    var item = S.byId[id];
    if (!item) return;
    var prev = item[field];
    if (prev === value) return;
    if (!me()) {
      // Put the control back as it was, then ask for the name and redo the change.
      replaceRow(id);
      if (S.openId === id) fillDrawerFields(item);
      withMe(function () { save(id, field, value); });
      return;
    }
    if (field === 'status' && value === 'Review Points') {
      replaceRow(id);
      if (S.openId === id) fillDrawerFields(item);
      openReview(id);
      return;
    }
    item[field] = value;
    var prevDays = item.daysInStatus;
    if (field === 'status') item.daysInStatus = value === 'Done' || value === 'Moved' || value === 'Withdraw' ? null : 0;
    var patch = {}; patch[field] = value;
    replaceRow(id);
    renderKpis(); renderBreakdown(); renderWorkload();
    busy(1);
    return call('updateItem', id, patch, me()).then(function (fresh) {
      busy(-1);
      Object.assign(item, fresh);
      replaceRow(id, true);
      renderKpis(); renderBreakdown(); renderWorkload();
      if (S.openId === id) fillDrawerFields(item, field);
      if (S.openId === id) loadDetail(id);
      return fresh;
    }).catch(function (e) {
      busy(-1);
      item[field] = prev;
      item.daysInStatus = prevDays;
      replaceRow(id);
      renderKpis(); renderBreakdown(); renderWorkload();
      if (S.openId === id) fillDrawerFields(item);
      failSync(e.message);
    });
  }

  function fieldValue(el) {
    if (el.type === 'checkbox') return el.checked;
    if (el.dataset.field === 'highPriority') return el.value === 'true';
    return el.value;
  }

  // ------------------------------------------------------------ drawer
  function openDrawer(id, focusNotes) {
    var item = S.byId[id];
    if (!item) { toast('AXO ' + id + ' is not in the tracker.', true); return; }
    S.openId = id;
    $('scrim').hidden = false;
    $('drawer').hidden = false;
    $('d-id').textContent = 'AXO ' + item.id;
    $('d-type').innerHTML = '<span class="type ' + (item.itemType === 'Bug' ? 'bug' : 'story') + '">' + esc(item.itemType) + '</span>';
    $('d-prio').className = 'prio ' + item.priority;
    $('d-prio').textContent = item.priority || 'No priority';
    $('d-title').textContent = item.name;
    $('d-people').innerHTML = peopleHtml(item).replace(/^<div class="people">|<\/div>$/g, '');
    $('d-status').innerHTML = '<option value="">Not started</option>' + options(S.statuses.map(function (s) { return s.name; }), item.status);
    $('d-handler').innerHTML = options(S.lists.handlers, item.handler, 'Unassigned');
    $('d-system').innerHTML = options(S.lists.systems, item.system, '—');
    $('d-cat').innerHTML = options(S.lists.categories, item.axoCategory, '—');
    $('d-quarter').innerHTML = (item.quarter ? '' : '<option value="">—</option>') + quarterOptions(item.quarter);
    fillDrawerFields(item);
    $('d-saved').textContent = '';
    $('note-hint').textContent = me() ? 'as ' + me() : 'Pick your name in the top bar so notes are signed';
    $('d-facts').innerHTML = [
      ['Workflow Step', item.workflowStep], ['Priority', item.priority], ['Developer', item.developer],
      ['BA', item.reportedBy], ['Release Notes', item.releaseNotes],
      ['Last imported', item.lastImported ? fmtWhen(item.lastImported) + (item.inLatestImport ? '' : ' (not in latest export)') : 'Added by hand'],
      ['Last updated', item.updatedAt ? fmtWhen(item.updatedAt) + ' by ' + item.updatedBy.replace(/\s*<.*>$/, '') : '']
    ].map(function (r) {
      var v = r[0] === 'Workflow Step' ? wfChip(r[1]) : esc(r[1]);
      return '<dt>' + r[0] + '</dt><dd>' + (v || '<span class="muted">—</span>') + '</dd>';
    }).join('');
    $('notes').innerHTML = '<li class="muted">Loading notes…</li>';
    $('activity').innerHTML = '';
    loadDetail(id);
    (focusNotes ? $('note-text') : $('d-close')).focus();
  }

  function fillDrawerFields(item, skipField) {
    ['d-status', 'd-handler', 'd-system', 'd-cat', 'd-quarter', 'd-done', 'd-hp', 'd-cdev', 'd-csed'].forEach(function (id) {
      var el = $(id), f = el.dataset.field;
      if (f === skipField && document.activeElement === el) return;
      if (document.activeElement === el && el.tagName === 'TEXTAREA') return;
      var v = item[f];
      if (f === 'highPriority') v = v ? 'true' : 'false';
      if (el.tagName === 'SELECT' && v && !Array.prototype.some.call(el.options, function (o) { return o.value === v; })) {
        el.insertAdjacentHTML('beforeend', '<option>' + esc(v) + '</option>');
      }
      el.value = v == null ? '' : v;
    });
    var st = $('d-status');
    st.setAttribute('style', statusStyle(item.status) + (item.status ? ';font-weight:700' : ''));
    $('d-rp').hidden = item.status !== 'Review Points';
    var dl = $('d-days');
    dl.className = 'dis-line' + (isStuck(item) ? ' warn' : '');
    dl.innerHTML = item.daysInStatus == null ? '' : '<b>' + item.daysInStatus + ' working day' + (item.daysInStatus === 1 ? '' : 's') + '</b> in ' +
      esc(item.status || 'Not started') + (item.statusSince ? ', since ' + esc(fmtWhen(item.statusSince)) : '') +
      (isStuck(item) ? '. The handler gets a Slack nudge.' : '');
  }

  function loadDetail(id) {
    return call('getItemDetail', id).then(function (d) {
      if (S.openId !== id) return;
      S.noteCounts[id] = d.notes.length;
      $('notes').innerHTML = d.notes.length ? d.notes.map(noteHtml).join('') : '<li class="muted">No notes yet.</li>';
      $('activity').innerHTML = d.activity.length ? d.activity.map(function (a) {
        return '<li><b>' + esc(a.who.replace(/\s*<.*>$/, '')) + '</b> set ' + esc(a.field) +
          (a.from ? ' from “' + esc(a.from) + '”' : '') + ' to “' + esc(a.to || '(blank)') + '” · ' + esc(fmtWhen(a.when)) + '</li>';
      }).join('') : '<li>No changes recorded yet.</li>';
    }).catch(function (e) { $('notes').innerHTML = '<li class="muted">Could not load notes: ' + esc(e.message) + '</li>'; });
  }

  function noteHtml(n) {
    return '<li class="note k-' + esc(String(n.kind).replace(/[^A-Za-z0-9]+/g, '-')) + '"><div class="note-meta"><span class="note-kind">' + esc(n.kind) + '</span><b>' +
      esc(n.author.replace(/\s*<.*>$/, '')) + '</b><span>' + esc(fmtWhen(n.createdAt)) + '</span></div><p>' + esc(n.text) + '</p></li>';
  }

  function closeDrawer() {
    var el = document.activeElement;
    if (el && el.tagName === 'TEXTAREA' && el.dataset.field) el.blur();
    var id = S.openId;
    S.openId = null;
    $('scrim').hidden = true;
    $('drawer').hidden = true;
    if (id) replaceRow(id);
  }

  // ------------------------------------------------------------ import / add
  var importText = null;
  function pickFile(file) {
    $('import-err').hidden = true;
    $('import-result').hidden = true;
    if (!file) return;
    if (!/\.csv$/i.test(file.name)) { showErr('import-err', 'Choose the .csv export from AXO.'); return; }
    var r = new FileReader();
    r.onload = function () {
      importText = String(r.result);
      var lines = importText.split(/\r?\n/).filter(function (l) { return l.trim(); }).length - 1;
      $('drop-title').textContent = file.name;
      $('drop-sub').textContent = 'About ' + Math.max(lines, 0) + ' rows. Click Import to load them.';
      $('import-go').disabled = false;
    };
    r.readAsText(file);
  }
  function showErr(id, msg) { $(id).textContent = msg; $(id).hidden = false; }

  var lastImport = null;
  function runImport(readd) {
    if (readd === true) importText = lastImport; else readd = false;
    if (!importText) return;
    $('import-go').disabled = true;
    $('import-go').textContent = 'Importing…';
    var text = importText, quarter = $('import-quarter').value;
    call('importCsv', text, me(), quarter, !!readd).then(function (res) {
      $('import-result').hidden = false;
      $('import-result').innerHTML = '<b>' + res.added + '</b> new (tagged ' + esc(res.quarter) + '), <b>' + res.updated + '</b> updated, ' + res.unchanged + ' unchanged' +
        (res.dropped ? ', ' + res.dropped + ' no longer in the export (kept, flagged)' : '') + '.' +
        (res.skippedDeleted ? '<br><b>' + res.skippedDeleted + '</b> skipped because ' + (res.skippedDeleted === 1 ? 'it was' : 'they were') +
          ' deleted from the tracker earlier.<button type="button" class="btn btn-sm" id="import-readd">Import ' + (res.skippedDeleted === 1 ? 'it' : 'them') + ' again</button>' : '');
      lastImport = res.skippedDeleted ? text : null;
      importText = null;
      $('import-go').textContent = 'Import';
      $('drop-title').textContent = 'Drop another CSV or click to choose';
      return load(false);
    }).catch(function (e) {
      $('import-go').disabled = false;
      $('import-go').textContent = 'Import';
      showErr('import-err', e.message);
    });
  }

  function openAdd() {
    $('add-err').hidden = true;
    $('add-form').reset();
    $('a-cat').innerHTML = options(S.lists.categories, '', '—');
    $('a-handler').innerHTML = options(S.lists.handlers, me(), 'Unassigned');
    $('a-system').innerHTML = options(S.lists.systems, '', '—');
    $('a-quarter').innerHTML = quarterOptions(selectedQuarter() || S.currentQuarter);
    $('add-dlg').showModal();
  }

  // ------------------------------------------------------------ review points
  var rpId = null;
  function openReview(id) {
    var item = S.byId[id];
    if (!item) return;
    rpId = id;
    $('rp-err').hidden = true;
    $('rp-text').value = '';
    $('rp-title').textContent = 'Review points for AXO ' + id;
    $('rp-sub').textContent = item.name;
    $('rp-reviewer').innerHTML = options(S.lists.handlers, me(), 'Pick the reviewer');
    var to = $('rp-to'), h = item.handler;
    var dmReady = S.slackDm && S.lists.slackHandlers.indexOf(h) >= 0;
    to.className = 'rp-to' + (dmReady ? '' : ' warn');
    to.innerHTML = !h ? 'This AXO has no handler. Points are saved' + (S.slack ? ' and posted to the channel.' : '.') :
      dmReady ? 'Sent to <b>' + esc(h) + '</b> as a Slack DM and saved in the notes.' :
      S.slack ? '<b>' + esc(h) + '</b> can’t be DMed yet (' + (S.slackDm ? 'no Slack ID in the Lists tab' : S.slackTokenIssue ? 'the Slack token saved is not the bot token' : 'Slack bot token not set') + '). Points will post to the channel with a mention.' :
      'Slack isn’t connected. Points are saved in the notes only.';
    $('rp-dlg').showModal();
    $('rp-text').focus();
  }

  // ------------------------------------------------------------ delete
  var delIds = [];
  function openDelete() {
    delIds = Object.keys(S.selected);
    if (!delIds.length) return;
    var n = delIds.length, all = n === S.items.length && n > 1;
    $('del-title').textContent = all ? 'Delete ALL ' + n + ' AXOs?' : 'Delete ' + (n === 1 ? 'this AXO?' : 'these ' + n + ' AXOs?');
    var shown = delIds.slice(0, 8).map(function (id) { return '<li><b>' + esc(id) + '</b>' + esc(S.byId[id] ? S.byId[id].name : '') + '</li>'; });
    if (n > 8) shown.push('<li class="more">and ' + (n - 8) + ' more</li>');
    $('del-list').innerHTML = shown.join('');
    $('del-pass').value = ''; $('del-confirm').value = '';
    $('del-confirm-wrap').hidden = n < 10;
    $('del-go').textContent = 'Delete ' + (all ? 'ALL ' + n : n === 1 ? '1 AXO' : n + ' AXOs');
    $('del-go').disabled = false;
    $('del-err').hidden = true;
    if (!S.deleteEnabled) {
      showErr('del-err', 'Deleting is switched off until the tracker owner sets a delete passcode (DELETE_PASSCODE in the script settings).');
      $('del-go').disabled = true;
    }
    $('del-dlg').showModal();
    $('del-pass').focus();
  }

  function runDelete() {
    if (!$('del-confirm-wrap').hidden && $('del-confirm').value.trim() !== 'DELETE') {
      showErr('del-err', 'Type DELETE in capitals to confirm.');
      return;
    }
    $('del-go').disabled = true;
    $('del-err').hidden = true;
    busy(1);
    call('deleteItems', delIds, $('del-pass').value, me()).then(function (res) {
      busy(-1);
      var gone = {};
      res.deleted.forEach(function (id) { gone[id] = true; });
      if (S.openId && gone[S.openId]) closeDrawer();
      S.items = S.items.filter(function (i) { return !gone[i.id]; });
      res.deleted.forEach(function (id) { delete S.byId[id]; });
      S.selected = {};
      $('del-dlg').close();
      renderQuarters(); render();
      toast(res.deleted.length + ' AXO' + (res.deleted.length === 1 ? '' : 's') + ' moved to the Deleted tab');
    }).catch(function (e) {
      busy(-1);
      $('del-go').disabled = false;
      showErr('del-err', e.message);
    });
  }

  // ------------------------------------------------------------ email (Outlook draft)
  function mailText(item) {
    var first = function (name) { return String(name || '').replace(/\s*-\s*QA$/i, ''); };
    var clip = function (t) { t = String(t || '').trim(); return t.length > 400 ? t.slice(0, 400) + '…' : t; };
    var lines = [
      'Hi,', '',
      'AXO ' + item.id + ': ' + item.name, '',
      'Item Type: ' + item.itemType,
      'AXO Category: ' + (item.axoCategory || '-'),
      'Priority: ' + (item.priority || '-') + (item.highPriority ? ' (High Priority)' : ''),
      'Workflow Step: ' + (item.workflowStep || '-'),
      'Developer: ' + (item.developer || '-'),
      'BA: ' + (item.reportedBy || '-'),
      'Quarter: ' + (item.quarter || '-'),
      'System: ' + (item.system || '-'),
      'Handler: ' + (item.handler || 'Unassigned'),
      'Status: ' + (item.status || 'Not started') + (item.daysInStatus != null ? ' (' + item.daysInStatus + ' working day' + (item.daysInStatus === 1 ? '' : 's') + ')' : ''),
      'Date of Completion: ' + (item.completedOn || '-')
    ];
    if (item.commentDev) lines.push('', 'Comment/Note (DEV):', clip(item.commentDev));
    if (item.commentSed) lines.push('', 'Comment/Note (SED):', clip(item.commentSed));
    if (S.appUrl) lines.push('', 'Tracker: ' + S.appUrl + '?axo=' + encodeURIComponent(item.id));
    lines.push('', 'Thanks,', first(me()) || '');
    return lines.join('\n');
  }

  function mailLinks() {
    var list = function (v) { return v.split(/[;,\s]+/).filter(Boolean); };
    var to = list($('mail-to').value), cc = list($('mail-cc').value);
    var subject = $('mail-subject').value, body = $('mail-body').value;
    var addr = function (a) { return a.map(function (x) { return encodeURIComponent(x).replace(/%40/g, '@'); }).join(';'); };
    // Outlook separates recipients with semicolons; line breaks must be CRLF in a mailto link.
    var app = 'mailto:' + addr(to) + '?' + (cc.length ? 'cc=' + addr(cc) + '&' : '') +
      'subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body.replace(/\r?\n/g, '\r\n'));
    var web = 'https://outlook.office.com/mail/deeplink/compose?to=' + encodeURIComponent(to.join(';')) +
      (cc.length ? '&cc=' + encodeURIComponent(cc.join(';')) : '') +
      '&subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
    $('mail-app').href = app;
    $('mail-web').href = web;
    var hint = $('mail-hint');
    hint.className = 'rp-to';
    if (!to.length) {
      hint.className = 'rp-to warn';
      hint.textContent = 'No recipients yet. Type them here, or set the defaults once in the Lists tab of the Google Sheet (Email To and Email CC columns).';
    } else if (app.length > 1900) {
      hint.className = 'rp-to warn';
      hint.textContent = 'This is a long message. If Outlook opens it cut short, use Copy text and paste it into the email.';
    } else {
      hint.textContent = 'Nothing is sent from here: Outlook opens with this draft and you click Send.';
    }
  }

  function openMail(id) {
    var item = S.byId[id];
    if (!item) return;
    $('mail-to').value = S.emailTo.join('; ');
    $('mail-cc').value = S.emailCc.join('; ');
    $('mail-subject').value = 'AXO ' + item.id + ' | ' + (item.status || 'Not started') + ' | ' + item.name;
    $('mail-body').value = mailText(item);
    mailLinks();
    $('mail-dlg').showModal();
  }

  // ------------------------------------------------------------ report
  function qRange(label) {
    var m = /^Q([1-4]) (\d{4})$/.exec(label || '');
    if (!m) return null;
    var q = +m[1], y = +m[2], pad = function (n) { return (n < 10 ? '0' : '') + n; };
    return { from: y + '-' + pad(q * 3 - 2) + '-01', to: y + '-' + pad(q * 3) + '-' + pad(new Date(y, q * 3, 0).getDate()) };
  }
  function shiftDay(day, delta) {
    var p = day.split('-'), d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + delta));
    return d.toISOString().slice(0, 10);
  }
  function reportOpts() {
    return { quarter: $('rep-scope').value, from: $('rep-from').value, to: $('rep-to').value, includeList: $('rep-list').checked, actorName: me() };
  }
  function setReportRange(preset) {
    var today = S.today, from = today, to = today, r = qRange($('rep-scope').value);
    if (preset === 'quarter' && r) { from = r.from; to = r.to < today ? r.to : (r.from > today ? r.to : today); }
    else if (preset === 'quarter') { from = shiftDay(today, -89); }
    else if (preset === '7') { from = shiftDay(today, -6); }
    else if (preset === 'month') { from = today.slice(0, 8) + '01'; }
    else if (preset === 'week') {
      // The team's week starts on Tuesday.
      var p = today.split('-'), dow = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay();
      from = shiftDay(today, -((dow - 2 + 7) % 7));
    }
    $('rep-from').value = from; $('rep-to').value = to;
  }
  var reportSeq = 0;
  function loadReport() {
    var seq = ++reportSeq, paper = $('report-paper');
    $('rep-dl').hidden = true;
    paper.innerHTML = '<div class="rep-msg">Building the report…</div>';
    call('buildReport', reportOpts()).then(function (res) {
      if (seq !== reportSeq) return;
      paper.innerHTML = res.html;
    }).catch(function (e) {
      if (seq !== reportSeq) return;
      paper.innerHTML = '<div class="rep-msg">Could not build the report: ' + esc(e.message) + '</div>';
    });
  }
  function openReport() {
    $('rep-scope').innerHTML = '<option value="">All quarters</option>' + quarterOptions(selectedQuarter());
    if (!selectedQuarter()) $('rep-scope').value = '';
    setReportRange('quarter');
    $('report-dlg').showModal();
    loadReport();
  }
  function downloadPdf() {
    var btn = $('rep-pdf');
    btn.disabled = true; btn.textContent = 'Preparing PDF…';
    call('reportPdf', reportOpts()).then(function (res) {
      var bin = atob(res.base64), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var link = $('rep-dl-link');
      if (link.href) URL.revokeObjectURL(link.href);
      link.href = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
      link.download = res.filename;
      link.textContent = res.filename;
      $('rep-dl').hidden = false;
      link.click();
    }).catch(function (e) {
      toast('Could not make the PDF: ' + e.message, true);
    }).then(function () { btn.disabled = false; btn.textContent = 'Download PDF'; });
  }

  // ------------------------------------------------------------ events
  function bind() {
    // Selection + delete
    $('sel-head').addEventListener('change', function (e) { selectAllVisible(e.target.checked); });
    $('sel-all').addEventListener('click', function () { selectAllVisible(true); });
    $('sel-clear').addEventListener('click', function () { selectAllVisible(false); });
    $('sel-delete').addEventListener('click', function () { withMe(openDelete); });
    $('del-cancel').addEventListener('click', function () { $('del-dlg').close(); });
    $('del-form').addEventListener('submit', function (e) { e.preventDefault(); runDelete(); });

    // Email
    $('d-email').addEventListener('click', function () { if (S.openId) openMail(S.openId); });
    ['mail-to', 'mail-cc', 'mail-subject', 'mail-body'].forEach(function (id) { $(id).addEventListener('input', mailLinks); });
    $('mail-cancel').addEventListener('click', function () { $('mail-dlg').close(); });
    $('mail-copy').addEventListener('click', function () {
      var text = 'To: ' + $('mail-to').value + '\nCC: ' + $('mail-cc').value + '\nSubject: ' + $('mail-subject').value + '\n\n' + $('mail-body').value;
      var done = function () { toast('Copied. Paste it into a new Outlook email.'); };
      var fallback = function () { $('mail-body').select(); document.execCommand('copy'); done(); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
    });

    // Report
    $('report-btn').addEventListener('click', openReport);
    $('rep-close').addEventListener('click', function () { $('report-dlg').close(); });
    $('rep-scope').addEventListener('change', function () { setReportRange('quarter'); loadReport(); });
    ['rep-from', 'rep-to', 'rep-list'].forEach(function (id) { $(id).addEventListener('change', loadReport); });
    document.querySelector('.rep-presets').addEventListener('click', function (e) {
      var b = e.target.closest('[data-preset]');
      if (b) { setReportRange(b.dataset.preset); loadReport(); }
    });
    $('rep-pdf').addEventListener('click', downloadPdf);
    $('rep-print').addEventListener('click', function () { window.print(); });

    $('q-tabs').addEventListener('click', function (e) {
      var b = e.target.closest('[data-q]');
      if (!b) return;
      S.quarter = b.dataset.q;
      saveQuarter(); renderQuarters(); render();
    });
    $('q-year').addEventListener('change', function (e) {
      S.year = e.target.value;
      saveQuarter(); renderQuarters(); render();
    });

    $('rp-cancel').addEventListener('click', function () { $('rp-dlg').close(); });
    $('d-rp-btn').addEventListener('click', function () { var id = S.openId; if (id) withMe(function () { openReview(id); }); });
    $('rp-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var id = rpId, text = $('rp-text').value.trim(), reviewer = $('rp-reviewer').value;
      if (!id || !text) return;
      if (!reviewer) { showErr('rp-err', 'Pick who is reviewing.'); return; }
      $('rp-send').disabled = true;
      busy(1);
      call('setReviewPoints', id, text, reviewer).then(function (res) {
        busy(-1);
        $('rp-send').disabled = false;
        $('rp-dlg').close();
        Object.assign(S.byId[id], res.item);
        S.noteCounts[id] = (S.noteCounts[id] || 0) + 1;
        S.reviews.push({ id: id, by: reviewer });
        replaceRow(id, true);
        renderKpis(); renderBreakdown(); renderWorkload();
        if (S.openId === id) { fillDrawerFields(S.byId[id]); loadDetail(id); }
        var sl = res.slack || {};
        toast(sl.via === 'dm' ? 'Review points sent to ' + sl.to + ' on Slack' :
          sl.via === 'channel' ? 'Review points posted to the Slack channel (' + sl.reason + ')' :
          'Review points saved' + (sl.reason ? '; not sent to Slack: ' + sl.reason : ''), sl.via === 'none' && S.slack);
      }).catch(function (err) {
        busy(-1);
        $('rp-send').disabled = false;
        showErr('rp-err', err.message);
      });
    });

    $('me-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var v = $('me-dlg-select').value;
      if (!v) { showErr('me-err', 'Pick your name to continue.'); return; }
      setMe(v);
      $('me-select').value = v;
      if ($('f-handler').value === '__me') renderTable();
      $('me-dlg').close();
      var fn = afterMe; afterMe = null;
      toast('Signed in as ' + v);
      if (fn) fn();
    });
    $('me-cancel').addEventListener('click', function () { afterMe = null; $('me-dlg').close(); });
    $('me-dlg').addEventListener('close', function () { afterMe = null; });

    $('me-select').addEventListener('change', function (e) {
      setMe(e.target.value);
      if ($('f-handler').value === '__me') renderTable();
      toast(e.target.value ? 'Notes and edits will be signed as ' + e.target.value : 'Name cleared');
    });

    FILTER_IDS.forEach(function (id) {
      $(id).addEventListener(id === 'f-q' ? 'input' : 'change', function () { saveFilters(); renderTable(); renderKpis(); renderWorkload(); });
    });
    $('f-clear').addEventListener('click', function () {
      FILTER_IDS.forEach(function (id) { var el = $(id); if (el.type === 'checkbox') el.checked = false; else el.value = ''; });
      saveFilters(); renderTable(); renderKpis(); renderWorkload();
    });

    $('workload').addEventListener('click', function (e) {
      var b = e.target.closest('[data-handler]');
      if (!b) return;
      var sel = $('f-handler'), v = b.dataset.handler;
      if (v !== '__none' && !Array.prototype.some.call(sel.options, function (o) { return o.value === v; })) {
        sel.insertAdjacentHTML('beforeend', '<option>' + esc(v) + '</option>');
      }
      sel.value = sel.value === v ? '' : v;
      saveFilters(); renderTable(); renderKpis(); renderWorkload();
    });

    $('kpis').addEventListener('click', function (e) {
      var b = e.target.closest('[data-kpi]');
      if (!b) return;
      var k = b.dataset.kpi;
      $('f-hp').checked = k === 'hp';
      $('f-stuck').checked = k === 'stuck';
      $('f-handler').value = k === 'unassigned' ? '__none' : '';
      $('f-status').value = k.indexOf('g:') === 0 ? k : (k === 'hp' || k === 'unassigned' ? '__open' : '');
      saveFilters(); renderTable(); renderKpis(); renderWorkload();
    });

    function statusClick(e) {
      var b = e.target.closest('[data-status]');
      if (!b) return;
      $('f-status').value = b.dataset.status ? 's:' + b.dataset.status : 'g:Not Started';
      saveFilters(); renderTable(); renderKpis();
    }
    $('stack').addEventListener('click', statusClick);
    $('legend').addEventListener('click', statusClick);

    document.querySelector('thead').addEventListener('click', function (e) {
      var th = e.target.closest('th[data-sort]');
      if (!th) return;
      var k = th.dataset.sort;
      S.sort = { key: k, dir: S.sort.key === k ? -S.sort.dir : (k === 'id' || k === 'notes' || k === 'priority' || k === 'highPriority' || k === 'daysInStatus' ? -1 : 1) };
      renderTable();
    });

    var tbody = $('tbody');
    tbody.addEventListener('change', function (e) {
      var el = e.target, tr = el.closest('tr[data-id]');
      if (tr && el.classList.contains('sel-box')) {
        if (el.checked) S.selected[tr.dataset.id] = true; else delete S.selected[tr.dataset.id];
        tr.classList.toggle('is-sel', el.checked);
        updateSelBar();
        return;
      }
      if (!tr || !el.dataset.field) return;
      save(tr.dataset.id, el.dataset.field, fieldValue(el));
    });
    tbody.addEventListener('click', function (e) {
      var o = e.target.closest('[data-open]');
      if (o) openDrawer(o.dataset.open, o.dataset.focus === 'notes');
    });

    // Drawer fields: selects/date save on change, textareas on blur.
    ['d-status', 'd-handler', 'd-system', 'd-cat', 'd-quarter', 'd-done', 'd-hp'].forEach(function (id) {
      $(id).addEventListener('change', function (e) { drawerSave(e.target); });
    });
    ['d-cdev', 'd-csed'].forEach(function (id) {
      $(id).addEventListener('blur', function (e) { drawerSave(e.target); });
    });
    function drawerSave(el) {
      var id = S.openId;
      if (!id) return;
      var f = el.dataset.field, v = fieldValue(el);
      if (S.byId[id][f] === v) return;
      var p = save(id, f, v);
      if (!p) return;
      $('d-saved').textContent = 'Saving…';
      p.then(function (r) { if (r && S.openId === id) $('d-saved').textContent = 'Saved'; });
    }

    $('d-close').addEventListener('click', closeDrawer);
    $('scrim').addEventListener('click', closeDrawer);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !$('drawer').hidden && !document.querySelector('dialog[open]')) closeDrawer();
    });

    $('note-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var id = S.openId, text = $('note-text').value.trim(), kind = $('note-kind').value;
      if (!id || !text) return;
      if (!me()) { withMe(function () { $('note-form').requestSubmit(); }); return; }
      $('note-add').disabled = true;
      busy(1);
      call('addNote', id, kind, text, me()).then(function (note) {
        busy(-1);
        $('note-add').disabled = false;
        $('note-text').value = '';
        S.noteCounts[id] = (S.noteCounts[id] || 0) + 1;
        var list = $('notes');
        if (list.querySelector('.muted')) list.innerHTML = '';
        list.insertAdjacentHTML('afterbegin', noteHtml(note));
        if (kind === 'Blocker') toast('Blocker note added' + (S.slack ? ' and posted to Slack' : ''));
      }).catch(function (err) {
        busy(-1);
        $('note-add').disabled = false;
        failSync(err.message);
      });
    });
    $('note-text').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) $('note-form').requestSubmit();
    });

    // Import dialog
    $('import-btn').addEventListener('click', function () { withMe(openImport); });
    function openImport() {
      importText = null;
      $('import-go').disabled = true;
      $('import-err').hidden = true; $('import-result').hidden = true;
      $('drop-title').textContent = 'Drop the CSV here or click to choose';
      $('drop-sub').textContent = 'Item Type is mapped on import: defects → Bug, features → User Story';
      $('import-quarter').innerHTML = quarterOptions(selectedQuarter() || S.currentQuarter);
      $('import-dlg').showModal();
    }
    $('import-cancel').addEventListener('click', function () { $('import-dlg').close(); });
    $('import-go').addEventListener('click', function () { runImport(false); });
    $('import-result').addEventListener('click', function (e) { if (e.target.id === 'import-readd') runImport(true); });
    var drop = $('drop');
    drop.addEventListener('click', function () { $('file').click(); });
    drop.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } });
    $('file').addEventListener('change', function (e) { pickFile(e.target.files[0]); e.target.value = ''; });
    ['dragenter', 'dragover'].forEach(function (t) { drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
    ['dragleave', 'drop'].forEach(function (t) { drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
    drop.addEventListener('drop', function (e) { pickFile(e.dataTransfer.files[0]); });

    // Add dialog
    $('add-btn').addEventListener('click', function () { withMe(openAdd); });
    $('add-cancel').addEventListener('click', function () { $('add-dlg').close(); });
    $('add-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var item = {
        id: $('a-id').value.trim(), itemType: $('a-type').value, name: $('a-name').value.trim(),
        axoCategory: $('a-cat').value, priority: $('a-prio').value, handler: $('a-handler').value, system: $('a-system').value,
        highPriority: $('a-prio').value === 'High', quarter: $('a-quarter').value
      };
      call('addItem', item, me()).then(function (rec) {
        $('add-dlg').close();
        S.items.push(rec); S.byId[rec.id] = rec;
        render();
        toast('AXO ' + rec.id + ' added');
      }).catch(function (err) { showErr('add-err', err.message); });
    });

    // Pick up teammates' changes every minute while the tab is visible and idle.
    setInterval(function () {
      if (document.hidden || S.pending || document.querySelector('dialog[open]')) return;
      var a = document.activeElement;
      if (a && (a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || (a.tagName === 'INPUT' && a.type !== 'search'))) return;
      if (Date.now() - S.loadedAt < 55000) return;
      $('sync').className = 'sync busy'; $('sync-text').textContent = 'Refreshing';
      load(false).catch(function () { $('sync').className = 'sync err'; $('sync-text').textContent = 'Offline'; });
    }, 15000);
  }

  // ------------------------------------------------------------ start
  bind();
  load(true).then(function () {
    if (google.script.url && google.script.url.getLocation) {
      google.script.url.getLocation(function (loc) {
        var axo = loc && loc.parameter && loc.parameter.axo;
        if (axo) openDrawer(String(axo));
      });
    }
  }).catch(function (e) {
    $('tbody').innerHTML = '<tr><td colspan="13" class="empty">Could not load the tracker: ' + esc(e.message) + '</td></tr>';
    failSync(e.message);
  });
})();
</script>
