<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Colours follow the NPD QA Endorsement Tracker (ShipERP blue, sky, orange). Type is Geist. */
:root{
  --bg:#f5f8fb; --surface:#ffffff; --surface-2:#eef3f8; --fg:#14202c; --muted:#5a6878; --faint:#8a97a6;
  --line:#dde5ee; --line-strong:#c5d1de;
  --brand:#0F6EC8; --brand-ink:#ffffff; --sky:#059BD7; --orange:#F19305; --brand-soft:#e6f0fa;
  --ok:#1a8a4a; --warn:#b86e00; --bad:#c2372f; --bad-soft:#fbeceb;
  --dev:#0369A1; --ba:#B4510A;
  --wf-new:#64748B; --wf-approved:#2563EB; --wf-dev:#A16207; --wf-rework:#C2410C; --wf-review:#7C3AED; --wf-cases:#0F766E; --wf-ready:#15803D; --wf-file:#BE185D; --wf-release:#1E3A8A; --wf-rejected:#B91C1C;
  --shadow:0 1px 2px rgba(20,32,44,.06),0 4px 16px rgba(20,32,44,.06);
  --display:"Geist",system-ui,sans-serif; --body:"Geist",system-ui,sans-serif; --mono:"Geist Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1620; --surface:#15202c; --surface-2:#1b2836; --fg:#e4ebf2; --muted:#94a3b4; --faint:#6f7f91;
  --line:#26374a; --line-strong:#34485e;
  --brand:#4a9be6; --brand-ink:#0b1622; --sky:#3bb6ea; --orange:#f5a733; --brand-soft:#16304a;
  --ok:#4cc27e; --warn:#f0a83a; --bad:#ef6a62; --bad-soft:#3a1d1c;
  --dev:#38BDF8; --ba:#F5A733;
  --wf-new:#94A3B8; --wf-approved:#60A5FA; --wf-dev:#FACC15; --wf-rework:#FB923C; --wf-review:#A78BFA; --wf-cases:#2DD4BF; --wf-ready:#4ADE80; --wf-file:#F472B6; --wf-release:#A5B4FC; --wf-rejected:#F87171;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1620; --surface:#15202c; --surface-2:#1b2836; --fg:#e4ebf2; --muted:#94a3b4; --faint:#6f7f91;
  --line:#26374a; --line-strong:#34485e;
  --brand:#4a9be6; --brand-ink:#0b1622; --sky:#3bb6ea; --orange:#f5a733; --brand-soft:#16304a;
  --ok:#4cc27e; --warn:#f0a83a; --bad:#ef6a62; --bad-soft:#3a1d1c;
  --dev:#38BDF8; --ba:#F5A733;
  --wf-new:#94A3B8; --wf-approved:#60A5FA; --wf-dev:#FACC15; --wf-rework:#FB923C; --wf-review:#A78BFA; --wf-cases:#2DD4BF; --wf-ready:#4ADE80; --wf-file:#F472B6; --wf-release:#A5B4FC; --wf-rejected:#F87171;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-size:.92em}
.muted{color:var(--muted)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 20px}
.brandbar{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brandbar svg .box{stroke:var(--brand)} .brandbar svg .speed{stroke:var(--orange)}
.wordmark{font:800 19px/1 var(--display);color:var(--brand);letter-spacing:-.01em}
.wordmark span{color:var(--orange)}
.divider{width:1px;height:22px;background:var(--line)}
.app-name{font:700 15px/1.2 var(--display);white-space:nowrap}
.role{font:500 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:6px 10px;border-radius:999px}
.me{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.me select{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:5px 8px;font-size:13px;max-width:150px}
/* No name picked yet: the tracker is read-only until there is one. */
.me.missing{color:var(--bad);font-weight:600}
.me.missing select{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad-soft);color:var(--bad);font-weight:600}
.me.nudge select{animation:me-nudge .6s ease-in-out 2}
@keyframes me-nudge{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:5px 11px 5px 9px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.sync.busy i{background:var(--sky)} .sync.err i{background:var(--bad)}

.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:7px 13px;font-weight:500;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:var(--brand);filter:brightness(1.08)}
.btn-quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn-quiet:hover{color:var(--fg)}
.btn-sm{padding:4px 9px;font-size:12.5px}

/* ---------- page ---------- */
.wrap{max-width:1560px;margin:0 auto;padding:22px 20px 48px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font:600 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--sky);margin-bottom:8px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 24px;justify-content:space-between}
.page-head h1{font:700 clamp(22px,3.2vw,30px)/1.15 var(--display);letter-spacing:-.02em}

/* quarter tabs */
.quarters{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.q-tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.q-tabs button{border:0;background:transparent;border-radius:6px;padding:6px 12px;font-weight:500;font-size:13.5px;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:baseline}
.q-tabs button:hover{color:var(--fg)}
.q-tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(20,32,44,.12)}
.q-tabs button .n{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.q-tabs button[aria-selected="true"] .n{color:var(--brand)}
.q-tabs .now::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--orange);align-self:center}
.quarters select{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:6px 8px;font-size:13.5px}
.lede{color:var(--muted);margin:6px 0 0;max-width:70ch}
.lede b{color:var(--fg);font-weight:500}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-align:left;cursor:pointer;border-top:3px solid var(--line-strong)}
.kpi:hover{border-color:var(--line-strong)}
.kpi[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.kpi .k-label{font:600 11px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .k-val{font:700 26px/1.1 var(--display);letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .k-sub{font-size:12px;color:var(--faint)}
.kpi.t-brand{border-top-color:var(--brand)} .kpi.t-sky{border-top-color:var(--sky)}
.kpi.t-ok{border-top-color:var(--ok)} .kpi.t-neu{border-top-color:var(--faint)}
.kpi.t-orange{border-top-color:var(--orange)} .kpi.t-bad{border-top-color:var(--bad)}
.kpi.t-bad .k-val{color:var(--bad)}

/* status breakdown */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.breakdown{padding:14px 16px}
.breakdown-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.breakdown-head h2{font:700 15px/1.2 var(--display)}
.breakdown-head span{font-size:12px;color:var(--muted)}
.stack{display:flex;gap:2px;height:22px;border-radius:5px;overflow:hidden;background:var(--surface-2)}
.stack button{border:0;padding:0;min-width:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;font:700 11px/1 var(--body);overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px}
.legend button{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);background:none;border:0;padding:2px 0;cursor:pointer}
.legend button:hover{color:var(--fg)}
.legend i{width:10px;height:10px;border-radius:2px;flex:none}
.legend b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}

/* filters */
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font:600 10.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:6px 9px;font-size:13.5px;min-width:100px;max-width:100%}
.field input[type=search]{min-width:170px}
#f-status{max-width:150px}
.toggle{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted);cursor:pointer;padding-bottom:6px}
.toggle input{width:15px;height:15px;accent-color:var(--brand)}

/* table */
.table-scroll{overflow:auto;max-height:calc(100vh - 140px)}
.table-scroll table{border-collapse:separate;border-spacing:0;width:100%;min-width:1340px}
.table-scroll thead th{position:sticky;top:0;z-index:2;background:var(--bg);text-align:left;font:600 11px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.table-scroll thead th[data-sort]{cursor:pointer;user-select:none}
.table-scroll thead th[data-sort]:hover{color:var(--fg)}
.table-scroll thead th .arr{margin-left:4px;opacity:.35}
.table-scroll thead th[aria-sort] .arr{opacity:1;color:var(--brand)}
.table-scroll thead th.hp-head{color:var(--bad)}
.table-scroll tbody td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13.5px}
.table-scroll tbody tr:hover td{background:var(--surface-2)}
.table-scroll tbody tr.is-hp td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.table-scroll tbody tr.flash td{animation:flash 1.2s ease-out}
@keyframes flash{from{background:var(--brand-soft)}to{background:transparent}}
.id-link{font-family:var(--mono);font-weight:500;color:var(--brand);background:none;border:0;padding:0;cursor:pointer;font-size:13px}
.id-link:hover{text-decoration:underline}
.c-name{min-width:260px;max-width:520px}
.c-name .nm{font-weight:500;display:block;cursor:pointer}
.c-name .nm:hover{color:var(--brand)}
.c-name .sub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12px;color:var(--muted);margin-top:5px}
.c-name .gone{color:var(--warn)}
.people{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:5px;font-size:12.5px}
.people span{display:inline-flex;align-items:baseline;gap:5px;color:var(--fg)}
.people em{font-style:normal;font:700 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-radius:4px;padding:3px 5px}
.people em.dev{color:var(--dev);background:color-mix(in srgb,var(--dev) 14%,transparent)}
.people em.ba{color:var(--ba);background:color-mix(in srgb,var(--ba) 14%,transparent)}
/* workflow step chip: colour follows the AXO workflow stage */
.wf{--c:var(--muted);display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;line-height:1.3;color:var(--c);
  background:color-mix(in srgb,var(--c) 11%,transparent);border-radius:999px;padding:2px 9px 2px 8px;white-space:nowrap}
.wf::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
.wf-new{--c:var(--wf-new)} .wf-approved{--c:var(--wf-approved)} .wf-dev{--c:var(--wf-dev)} .wf-rework{--c:var(--wf-rework)}
.wf-review{--c:var(--wf-review)} .wf-cases{--c:var(--wf-cases)} .wf-ready{--c:var(--wf-ready)} .wf-file{--c:var(--wf-file)}
.wf-release{--c:var(--wf-release)} .wf-rejected{--c:var(--wf-rejected)}
.help-link{font-size:13.5px;font-weight:500;color:var(--brand);text-decoration:none;padding:7px 4px;white-space:nowrap}
.help-link:hover{text-decoration:underline}
.people .none{color:var(--faint)}
.q-tag{display:block;font-size:11px;color:var(--faint);margin-top:3px;white-space:nowrap}
.type{display:inline-block;font:500 11.5px/1 var(--body);padding:4px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.type.bug{color:var(--bad)} .type.story{color:var(--brand)}
.prio{font-size:12.5px;white-space:nowrap}
.prio::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--faint)}
.prio.High::before{background:var(--bad)} .prio.Medium::before{background:var(--orange)} .prio.Low::before{background:var(--sky)}
.cell-sel{width:100%;min-width:98px;background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:5px 7px;font-size:13px;cursor:pointer}
.status-sel{font-weight:700;border-color:transparent;min-width:150px}
.status-sel.none{font-weight:500;background:var(--surface);border-color:var(--line-strong);color:var(--muted)}
.cell-date{background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:4px 5px;font-size:12.5px;width:118px}
.hp-box{width:16px;height:16px;accent-color:var(--bad);cursor:pointer}
.notes-btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.notes-btn:hover{border-color:var(--brand);color:var(--brand)}
.notes-btn.has{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.table-foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:10px 14px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(8,14,22,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;border-left:1px solid var(--line)}
.d-head{padding:16px 18px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.d-top{display:flex;align-items:center;gap:8px}
.d-top .mono{font-weight:500;color:var(--brand)}
.d-top .d-actions{margin-left:auto;display:flex;gap:6px}
.d-head h2{font:600 18px/1.3 var(--display);letter-spacing:-.01em}
.d-head .people{font-size:13.5px;margin-top:0}
.rp-cta{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border-radius:8px;background:#FFF4D6;color:#5C4300;font-size:13px}
.rp-cta .btn{margin-left:auto;border-color:#E0A800;background:#FFC000;color:#1F1F1F;font-weight:600}
:root[data-theme="dark"] .rp-cta{background:#3a2f0e;color:#f3d98a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rp-cta{background:#3a2f0e;color:#f3d98a}}
.d-body{flex:1;overflow:auto;padding:16px 18px 24px;display:flex;flex-direction:column;gap:22px}
.d-body h3{font:700 14px/1.2 var(--display);margin-bottom:8px}
.facts{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:13.5px}
.facts dt{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.facts dd{margin:0}
.qa-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.qa-grid .full{grid-column:1/-1}
.qa-grid label{display:flex;flex-direction:column;gap:4px;font:600 10.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.qa-grid select,.qa-grid input,.qa-grid textarea,.note-form textarea,.note-form select{font:400 13.5px/1.45 var(--body);letter-spacing:0;text-transform:none;color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:7px 9px;width:100%}
.qa-grid textarea{min-height:64px;resize:vertical}
.saved-hint{font-size:12px;color:var(--ok);min-height:16px}
.note-form{display:flex;flex-direction:column;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.note-form textarea{min-height:76px;resize:vertical}
.note-form .row{display:flex;gap:8px;align-items:center}
.note-form .row select{width:auto}
.note-form .row .btn{margin-left:auto}
.notes{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.note{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.note.k-Blocker{border-left:3px solid var(--bad)}
.note.k-DEV{border-left:3px solid #00B0F0}
.note.k-SED{border-left:3px solid #E6C800}
.note.k-Review-Points{border-left:3px solid #FFC000;background:color-mix(in srgb,#FFC000 7%,var(--surface))}
.note.k-Review-Points .note-kind{background:#FFC000;color:#1F1F1F}
.note-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);margin-bottom:4px}
.note-meta b{color:var(--fg);font-weight:500}
.note-kind{font:600 10.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:3px 6px;border-radius:4px;background:var(--surface-2);color:var(--muted)}
.note.k-Blocker .note-kind{background:var(--bad-soft);color:var(--bad)}
.note p{margin:0;white-space:pre-wrap;word-break:break-word}
.activity{list-style:none;margin:0;padding:0;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.activity b{color:var(--fg);font-weight:500}

/* dialogs */
dialog{border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--fg);padding:0;width:min(560px,calc(100vw - 32px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(8,14,22,.5)}
.dlg-head{padding:16px 18px 0}
.dlg-head h2{font:700 18px/1.25 var(--display)}
.dlg-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.dlg-body{padding:14px 18px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line)}
.drop{border:1.5px dashed var(--line-strong);border-radius:8px;padding:22px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop strong{display:block;color:var(--fg);font-weight:500;margin-bottom:2px}
.dlg-err{margin-top:10px;padding:8px 10px;border-radius:6px;background:var(--bad-soft);color:var(--bad);font-size:13px}
.result{margin-top:10px;font-size:13.5px}
.tip{border-left:3px solid var(--orange);background:var(--bg);padding:8px 12px;border-radius:0 6px 6px 0;font-size:13px;margin-top:12px}
.tip b{color:var(--orange)}
.dlg-body .qa-grid,.dlg-body.qa-grid{margin:0}
.dlg-field{display:flex;flex-direction:column;gap:4px;margin-top:12px;font:600 10.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dlg-field select,.dlg-field textarea,.dlg-field input{font:400 13.5px/1.45 var(--body);letter-spacing:0;text-transform:none;color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:7px 9px;width:100%}
.dlg-field textarea{min-height:140px;resize:vertical}
.rp-to{margin-top:12px;font-size:13px;color:var(--muted)}
.rp-to b{color:var(--fg);font-weight:500}
